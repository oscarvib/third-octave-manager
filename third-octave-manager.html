<style>
/* Layout: instrument-software split — editable tree on the left, spectrum viewer on the right; stacks on phones. */
:root{
  --bg:#e9eeec; --panel:#f7f9f8; --panel-2:#eef3f1; --ink:#18211f; --muted:#5a6a66; --line:#cfd9d5;
  --accent:#2f6496; --accent-2:#5b8fc0; --accent-ink:#ffffff; --cursor:#b02c76; --sel:#d6e4f0; --sel-ink:#10263b;
  --good:#2c7a54; --warn:#a86512; --danger:#b8372b;
  --s1:#1f6fb4; --s2:#d62728; --s3:#2a9d3a; --s4:#f08a12; --s5:#8a56c2; --s6:#0fa3b8; --s7:#8c564b; --s8:#d64fa8; --s9:#9a9a1e; --s10:#6b7076;
  --f-sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-cond:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1514; --panel:#151d1b; --panel-2:#1b2522; --ink:#e2eae7; --muted:#93a39e; --line:#2a3633;
  --accent:#6a9fd2; --accent-2:#8db8e0; --accent-ink:#0b1622; --cursor:#ec6fb4; --sel:#22384c; --sel-ink:#e5f0fb;
  --good:#5cc08e; --warn:#e0a24f; --danger:#ee7a6d;
  --s1:#5aa2e6; --s2:#ff6b6b; --s3:#5cd16b; --s4:#ffad4d; --s5:#b691f0; --s6:#3fd3e3; --s7:#c99a85; --s8:#f27fcf; --s9:#cfd04a; --s10:#a8adb3;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1514; --panel:#151d1b; --panel-2:#1b2522; --ink:#e2eae7; --muted:#93a39e; --line:#2a3633;
  --accent:#6a9fd2; --accent-2:#8db8e0; --accent-ink:#0b1622; --cursor:#ec6fb4; --sel:#22384c; --sel-ink:#e5f0fb;
  --good:#5cc08e; --warn:#e0a24f; --danger:#ee7a6d;
  --s1:#5aa2e6; --s2:#ff6b6b; --s3:#5cd16b; --s4:#ffad4d; --s5:#b691f0; --s6:#3fd3e3; --s7:#c99a85; --s8:#f27fcf; --s9:#cfd04a; --s10:#a8adb3;
  color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-sans);font-size:14px;overflow:hidden}
*{box-sizing:border-box}
table{font-size:inherit;color:inherit}
button,select,input{font:inherit;color:inherit}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 12px;gap:10px}
header.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:10px 0}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;min-width:0}
.brand h1{font-family:var(--f-cond);font-weight:600;font-size:19px;letter-spacing:.01em;margin:0;white-space:nowrap}
.brand small{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.proj{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-right:6px;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj b{color:var(--ink);font-weight:500}
.proj .dirty{color:var(--warn)}
.tree-empty .btn{margin-top:10px;white-space:normal;text-align:left;max-width:100%}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);padding:6px 11px;border-radius:var(--r);cursor:pointer;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default;border-color:var(--line)}
.btn svg{width:15px;height:15px}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
main{display:grid;grid-template-columns:var(--treeW,320px) 6px minmax(0,1fr);min-height:0}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);min-height:0;min-width:0;display:flex;flex-direction:column}
.split{cursor:col-resize;position:relative}
.split::after{content:"";position:absolute;inset:40% 2px;border-left:1px dotted var(--muted);border-right:1px dotted var(--muted);opacity:.5}
.pane-h{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);font-family:var(--f-cond);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pane-h .sp{margin-left:auto;display:flex;gap:4px}
.ib{border:0;background:transparent;padding:4px;border-radius:4px;cursor:pointer;color:var(--muted);display:inline-flex}
.ib:hover{background:var(--panel-2);color:var(--ink)}
.ib svg{width:16px;height:16px}
#tree{flex:1;overflow:auto;padding:4px 0 40px;outline:none;user-select:none;-webkit-user-select:none}
.row{display:flex;align-items:center;gap:5px;height:27px;padding-left:calc(8px + var(--lvl) * 16px);padding-right:6px;cursor:default;white-space:nowrap;position:relative}
.row:hover{background:var(--panel-2)}
.row.sel{background:var(--sel);color:var(--sel-ink)}
.row.active .lbl{font-weight:600}
.row .caret{width:16px;height:16px;border:0;background:transparent;padding:0;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;flex:none}
.row .caret svg{width:10px;height:10px;transition:transform .12s}
.row.open .caret svg{transform:rotate(90deg)}
.row .caret.none{visibility:hidden}
.row .ico{width:16px;height:16px;flex:none;display:inline-flex;color:var(--warn)}
.row.m .ico{color:var(--accent)}
.row .lbl{overflow:hidden;text-overflow:ellipsis;min-width:0}
.row .sub{font-family:var(--f-mono);font-size:11px;color:var(--muted);flex:none}
.row .cnt{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:9px;padding:0 6px;flex:none}
.row .more{margin-left:auto;opacity:0}
.row:hover .more,.row.sel .more{opacity:1}
.row input.ren{font:inherit;border:1px solid var(--accent);border-radius:3px;padding:1px 4px;background:var(--panel);color:var(--ink);min-width:0;flex:1}
.row.cut{opacity:.5}
.row.drop-into{outline:2px solid var(--accent);outline-offset:-2px;background:var(--sel)}
.row.drop-before::before,.row.drop-after::after{content:"";position:absolute;left:calc(8px + var(--lvl)*16px);right:6px;height:2px;background:var(--accent)}
.row.drop-before::before{top:0}.row.drop-after::after{bottom:0}
#tree.drop-root{outline:2px dashed var(--accent);outline-offset:-4px}
.tree-empty{padding:18px 14px;color:var(--muted);line-height:1.5;font-size:13px}
.tree-foot{border-top:1px solid var(--line);padding:7px 10px;font-size:11.5px;color:var(--muted);line-height:1.45}
kbd{font-family:var(--f-mono);font-size:10.5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:0 4px;background:var(--panel-2)}

/* viewer */
#view{overflow:auto;padding:14px 16px 20px;display:flex;flex-direction:column;gap:14px}
#view>*{flex:none}
.vh{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap}
.vh .ttl{min-width:0;flex:1 1 260px}
.crumb{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vh h2{font-family:var(--f-cond);font-weight:600;font-size:24px;margin:2px 0 0;text-wrap:balance}
.big{display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap}
.big .k{font-family:var(--f-cond);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.big .v{font-family:var(--f-mono);font-size:30px;font-weight:500;line-height:1.05;font-variant-numeric:tabular-nums}
.big .v small{font-size:13px;color:var(--muted);margin-left:3px}
.big .alt .v{font-size:19px}
.info{display:flex;flex-wrap:wrap;gap:4px 22px;font-size:12.5px;border-block:1px solid var(--line);padding-block:7px}
.info span{color:var(--muted)}
.info b{font-family:var(--f-mono);font-weight:500;font-variant-numeric:tabular-nums;margin-left:5px}
.ctrls{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.ctrls label{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.ctrls select,.ctrls input[type=number]{border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:3px 6px;color:var(--ink)}
.ctrls input[type=number]{width:62px;font-family:var(--f-mono)}
.ctrls .sp{margin-left:auto;display:flex;gap:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:3px 10px;cursor:pointer;font-family:var(--f-mono);font-size:12.5px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.seg button:disabled{opacity:.4;cursor:default}
.chartwrap{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:12px}
.chartbox{position:relative;height:min(52vh,440px);min-height:260px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
#chart{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair;touch-action:none;outline:none;border-radius:var(--r)}
#chart:focus-visible{outline:2px solid var(--accent)}
.readout{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:10px 12px;font-size:12.5px;display:flex;flex-direction:column;gap:6px;min-width:0}
.readout h3{margin:0;font-family:var(--f-cond);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.readout .f{font-family:var(--f-mono);font-size:20px;font-weight:500}
.readout .fr{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.readout table{border-collapse:collapse;width:100%;table-layout:fixed;font-size:12.5px;font-variant-numeric:tabular-nums}
.readout td{padding:3px 0;border-bottom:1px dotted var(--line);vertical-align:middle}
.readout td.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:6px}
.readout td.vl{text-align:right;font-family:var(--f-mono);width:68px;white-space:nowrap}
.readout tr.cur td{color:var(--cursor);font-weight:600}
.readout tr.max td.vl{font-weight:600}
.mk{display:inline-block;vertical-align:-1px;margin-right:6px;flex:none}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px;flex:none}
.hint{font-size:11.5px;color:var(--muted);line-height:1.5}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
table.bands{border-collapse:collapse;font-family:var(--f-mono);font-size:11.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
table.bands th,table.bands td{padding:3px 7px;text-align:right;border-right:1px solid var(--line)}
table.bands thead th{background:var(--panel-2);font-weight:500;color:var(--muted);cursor:pointer;position:sticky;top:0}
table.bands th.rh{position:sticky;left:0;background:var(--panel);text-align:left;font-family:var(--f-sans);font-weight:500;color:var(--ink);z-index:1;cursor:default;max-width:240px;overflow:hidden;text-overflow:ellipsis}
table.bands thead th.rh{background:var(--panel-2);color:var(--muted)}
table.bands tbody tr+tr td,table.bands tbody tr+tr th{border-top:1px solid var(--line)}
table.bands .tot{font-weight:500;background:var(--panel-2)}
table.bands .cur{background:color-mix(in srgb,var(--cursor) 14%,transparent);color:var(--cursor)}
.sec-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sec-h h4{margin:0;font-family:var(--f-cond);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sec-h .sp{margin-left:auto;display:flex;gap:6px}
table.list{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums}
table.list th{text-align:left;font-weight:500;color:var(--muted);font-size:11.5px;padding:5px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.list td{padding:4px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.list td.n{font-family:var(--f-mono);text-align:right}
table.list td.t{font-family:var(--f-mono)}
table.list th.n{text-align:right}
table.list tr{cursor:pointer}
table.list tr.off td{opacity:.4}
table.list tbody tr:hover td{background:var(--panel-2)}
table.list td.cur,table.list th.cur{color:var(--cursor);font-weight:600}
.meanrow td,.meanrow th{font-weight:600!important;background:var(--panel-2)}
table.list tfoot td{border-top:2px solid var(--line);cursor:default}
.readout tr.mean td{font-weight:600;border-top:1px solid var(--line)}
.empty{margin:auto;max-width:440px;text-align:center;color:var(--muted);line-height:1.6;padding:30px 10px}
.empty h2{font-family:var(--f-cond);color:var(--ink);font-size:22px;margin:0 0 6px}

/* menus & dialogs */
.menu{position:fixed;z-index:50;min-width:210px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 8px 28px rgba(0,0,0,.18);padding:4px;font-size:13px}
.menu button{display:flex;width:100%;align-items:center;gap:10px;border:0;background:transparent;padding:6px 10px;border-radius:4px;cursor:pointer;text-align:left}
.menu button:hover,.menu button:focus-visible{background:var(--sel);color:var(--sel-ink);outline:none}
.menu button .k{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.menu button.danger{color:var(--danger)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
.menu .mh{padding:4px 10px 2px;font-size:11px;color:var(--muted);font-family:var(--f-mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:260px}
.scrim{position:fixed;inset:0;z-index:60;background:rgba(10,16,15,.38);display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:8px;width:min(480px,100%);max-height:90vh;display:flex;flex-direction:column;box-shadow:0 16px 48px rgba(0,0,0,.25)}
.dlg.wide{width:min(1040px,100%)}
.dlg h3{margin:0;padding:14px 16px 8px;font-family:var(--f-cond);font-size:18px}
.dlg .b{padding:4px 16px 12px;overflow:auto;font-size:13px;line-height:1.5;display:flex;flex-direction:column;gap:10px}
.dlg .a{display:flex;justify-content:flex-end;gap:8px;padding:10px 16px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.dlg label.ck{display:flex;gap:8px;align-items:flex-start}
.dlg select,.dlg input[type=text]{border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:4px 6px;width:100%;color:var(--ink)}
.dlg .opts{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.dlg .opts label{display:flex;gap:6px;align-items:center;color:var(--muted)}
.dlg .opts select{width:auto}
.prev{border:1px solid var(--line);border-radius:5px;background:#fff;max-width:100%;height:auto;display:block}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-radius:10px;padding:1px 7px;background:var(--panel-2)}
.flist{border:1px solid var(--line);border-radius:5px;max-height:300px;overflow:auto}
.flist button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:5px 8px;cursor:pointer}
.flist button:hover{background:var(--panel-2)}

<script type="text/plain" id="wsrc">
/* Worker: reads UNV time histories (dataset 58 / 58b), keeps the signals, and computes Welch spectra + octave bands. */
"use strict";
const SIG = new Map();   // key -> {fs, data: Float32Array, units}

/* ---------- UNV dataset 58 reader ---------- */
function parseUnv(buf, fileName){
  const u8 = new Uint8Array(buf); const len = u8.length; let pos = 0;
  const line = () => {
    if (pos >= len) return null;
    let e = u8.indexOf(10, pos); if (e < 0) e = len;
    let s = ""; const end = (e > pos && u8[e-1] === 13) ? e - 1 : e;
    for (let i = pos; i < end; i += 8192) s += String.fromCharCode.apply(null, u8.subarray(i, Math.min(end, i + 8192)));
    pos = e + 1; return s;
  };
  const isEnd = s => s !== null && s.trim() === "-1";
  const numRe = /[-+]?(?:\d+\.?\d*|\.\d+)(?:[EeDd][-+]?\d+)?/g;
  const nums = s => (s.match(numRe) || []).map(x => parseFloat(x.replace(/[Dd]/, "E")));
  const chans = []; let skipped = 0;
  while (pos < len){
    const l = line(); if (l === null) break;
    if (!isEnd(l)) continue;
    const h = line(); if (h === null) break;
    const tok = h.trim().split(/\s+/);
    const ds = tok[0] || "";
    if (ds !== "58" && ds.toLowerCase() !== "58b"){
      skipped++;
      // skip to the dataset terminator
      while (pos < len){ const s = line(); if (s === null || isEnd(s)) break; }
      continue;
    }
    const bin = ds.toLowerCase() === "58b";
    const R = []; for (let i = 0; i < 11; i++) R.push(line() || "");
    const r6 = R[5], r7 = nums(R[6]);
    const ordType = r7[0] | 0, nPts = r7[1] | 0, even = (r7[2] | 0) === 1, x0 = r7[3] || 0, dx = r7[4] || 0;
    const fld = (s, a, b) => s.length > a ? s.slice(a, b).trim() : "";
    const ord = R[8];
    const ch = {
      id1: R[0].trim(), id2: R[1].trim(), id3: R[2].trim(), id4: R[3].trim(), id5: R[4].trim(),
      ftype: parseInt(fld(r6, 0, 5)) || 0,
      entity: fld(r6, 35, 45), node: parseInt(fld(r6, 45, 55)) || 0, dir: parseInt(fld(r6, 55, 59)) || 0,
      absType: parseInt(fld(R[7], 0, 10)) || 0, absUnits: fld(R[7], 47, 67),
      ordCode: parseInt(fld(ord, 0, 10)) || 0, ordLabel: fld(ord, 26, 46), units: fld(ord, 47, 67),
      n: nPts, x0, dx, ordType, even
    };
    let data = null;
    const complex = ordType === 5 || ordType === 6;
    if (bin){
      const order = parseInt(tok[1]) || 1, nBytes = parseInt(tok[4]) || 0;
      const dv = new DataView(buf, pos, Math.min(nBytes, len - pos)); const le = order !== 2;
      const dbl = ordType === 4 || ordType === 6;
      const step = dbl ? 8 : 4; const get = dbl ? (o => dv.getFloat64(o, le)) : (o => dv.getFloat32(o, le));
      if (!complex){
        data = new Float32Array(nPts);
        if (even){ for (let i = 0; i < nPts; i++) data[i] = get(i*step); }
        else {   // uneven: abscissa (single) + ordinate pairs
          const ps = 4 + step; const xa = dv.getFloat32(0, le), xb = nPts > 1 ? dv.getFloat32(ps, le) : xa + 1;
          ch.x0 = xa; ch.dx = xb - xa; for (let i = 0; i < nPts; i++) data[i] = get(i*ps + 4);
        }
      }
      pos += nBytes;
      while (pos < len){ const s = line(); if (s === null || isEnd(s)) break; }
    } else {
      const vals = []; let s;
      while ((s = line()) !== null && !isEnd(s)){ const a = s.match(numRe); if (a) for (const x of a) vals.push(parseFloat(x.replace(/[Dd]/, "E"))); }
      if (!complex){
        data = new Float32Array(nPts);
        if (even){ for (let i = 0; i < nPts && i < vals.length; i++) data[i] = vals[i]; }
        else { ch.x0 = vals[0]; ch.dx = (vals[2] ?? vals[0] + 1) - vals[0]; for (let i = 0; i < nPts; i++) data[i] = vals[2*i + 1]; }
      }
    }
    if (!data || !(ch.dx > 0) || (ch.absType && ch.absType !== 17 && ch.absType !== 0)){ skipped++; continue; }   // only time histories
    { const f = 1/ch.dx, r = Math.round(f); ch.fs = Math.abs(f - r)/f < 2e-4 ? r : f; }
    ch.data = data; ch.idx = chans.length; chans.push(ch);
  }
  return { chans, skipped };
}

/* ---------- mixed-radix FFT (factors 4,2,3,5,...) ---------- */
function plan(n){
  const fac = []; let r = n, p = 4; const fl = Math.floor(Math.sqrt(n));
  do { while (r % p){ p = p === 4 ? 2 : p === 2 ? 3 : p + 2; if (p > fl) p = r; } r /= p; fac.push(p, r); } while (r > 1);
  const twr = new Float64Array(n), twi = new Float64Array(n);
  for (let k = 0; k < n; k++){ const a = -2*Math.PI*k/n; twr[k] = Math.cos(a); twi[k] = Math.sin(a); }
  let mp = 0; for (let i = 0; i < fac.length; i += 2) mp = Math.max(mp, fac[i]);
  return { n, fac, twr, twi, sR: new Float64Array(mp), sI: new Float64Array(mp), oR: new Float64Array(n), oI: new Float64Array(n) };
}
function work(P, oR, oI, oo, iR, iI, io, fs, fi){
  const p = P.fac[fi], m = P.fac[fi + 1], end = oo + p*m;
  if (m === 1){ let k = io; for (let o = oo; o < end; o++){ oR[o] = iR[k]; oI[o] = iI[k]; k += fs; } }
  else { let k = io; for (let o = oo; o < end; o += m){ work(P, oR, oI, o, iR, iI, k, fs*p, fi + 2); k += fs; } }
  const n = P.n, twr = P.twr, twi = P.twi, sR = P.sR, sI = P.sI;
  if (p === 2){
    for (let u = 0; u < m; u++){ const a = oo + u, b = a + m; const t = (fs*u) % n; const wr = twr[t], wi = twi[t];
      const xr = oR[b]*wr - oI[b]*wi, xi = oR[b]*wi + oI[b]*wr; oR[b] = oR[a] - xr; oI[b] = oI[a] - xi; oR[a] += xr; oI[a] += xi; }
    return;
  }
  for (let u = 0; u < m; u++){
    let k = u; for (let q = 0; q < p; q++){ sR[q] = oR[oo + k]; sI[q] = oI[oo + k]; k += m; }
    k = u;
    for (let q1 = 0; q1 < p; q1++){
      let tw = 0, aR = sR[0], aI = sI[0];
      for (let q = 1; q < p; q++){ tw += fs*k; while (tw >= n) tw -= n; const wr = twr[tw], wi = twi[tw]; aR += sR[q]*wr - sI[q]*wi; aI += sR[q]*wi + sI[q]*wr; }
      oR[oo + k] = aR; oI[oo + k] = aI; k += m;
    }
  }
}
function fft(P, inR, inI){ work(P, P.oR, P.oI, 0, inR, inI, 0, 1, 0); return [P.oR, P.oI]; }
/* nearest length whose prime factors are 2, 3 or 5 */
function smooth(n){ const ok = x => { for (const p of [2, 3, 5]) while (x % p === 0) x /= p; return x === 1; }; for (let d = 0; ; d++){ if (n - d > 1 && ok(n - d)) return n - d; if (ok(n + d)) return n + d; } }

/* ---------- windows (symmetric, as Octave's hann/hamming/flattopwin) ---------- */
function windowFn(type, N){
  const w = new Float64Array(N); const D = N - 1 || 1;
  for (let i = 0; i < N; i++){ const x = 2*Math.PI*i/D;
    w[i] = type === "rect" ? 1 : type === "hamming" ? 0.54 - 0.46*Math.cos(x)
      : type === "flattop" ? 0.21557895 - 0.41663158*Math.cos(x) + 0.277263158*Math.cos(2*x) - 0.083578947*Math.cos(3*x) + 0.006947368*Math.cos(4*x)
      : 0.5 - 0.5*Math.cos(x); }
  return w;
}

/* ---------- quantity from units ---------- */
function quantity(units, code){
  const u = (units || "").toLowerCase().replace(/\s/g, "");
  if (/(^|[^a-z])(pa|n\/m\^?2|n\/m2)$/.test(u) || u === "pa" || code === 15) return { q: "sound", f: 1 };
  if (/^(m\/s\^?2|m\/s2|m\/s\*\*2|ms-2|m\/s²)$/.test(u)) return { q: "accel", f: 1 };
  if (/^(g|gs|g's|gn)$/.test(u)) return { q: "accel", f: 9.80665 };
  if (/^(mm\/s\^?2|mm\/s2)$/.test(u)) return { q: "accel", f: 1e-3 };
  if (/^(m\/s)$/.test(u)) return { q: "vel", f: 1 };
  if (/^(mm\/s)$/.test(u)) return { q: "vel", f: 1e-3 };
  if (code === 12) return { q: "accel", f: 1 };
  if (code === 11) return { q: "vel", f: 1 };
  return { q: "other", f: 1 };
}

/* ---------- Welch + band integration (as procesa_tercios.m) ---------- */
function bandsFor(kind, fmin, fmax){
  const step = kind === "1/1" ? 3 : 1, half = kind === "1/1" ? 3/20 : 1/20;
  const out = [];
  for (let n = -30; n <= 15; n += step){ const fc = 1000*Math.pow(10, n/10); if (fc < fmin*0.98 || fc > fmax*1.02) continue; out.push({ n, fc, lo: fc*Math.pow(10, -half), hi: fc*Math.pow(10, half) }); }
  return out;
}
function process(key, p){
  const s = SIG.get(key); if (!s) return { key, error: "Signal not loaded" };
  const fs = s.fs; const Q = quantity(s.units, s.code);
  const ref = Q.q === "sound" ? p.refP : Q.q === "accel" ? p.refA : Q.q === "vel" ? p.refV : 1;
  const i0 = Math.max(0, Math.round((p.t0 || 0)*fs)), i1 = Math.min(s.data.length, p.t1 > 0 ? Math.round(p.t1*fs) : s.data.length);
  const L = i1 - i0; if (L < 16) return { key, error: "Time range too short" };
  const gain = Q.f*Math.pow(10, (p.corr || 0)/20);
  let mean = 0; for (let i = i0; i < i1; i++) mean += s.data[i]; mean /= L;
  let N = smooth(Math.max(16, Math.round(fs/p.df))); if (N > L) N = smooth(L) <= L ? smooth(L) : L - (L % 2);
  const P = plan(N); const w = windowFn(p.win, N); let U = 0; for (let i = 0; i < N; i++) U += w[i]*w[i];
  const hop = Math.max(1, Math.round(N*(1 - (p.ov || 0)/100)));
  const half = Math.floor(N/2); const acc = new Float64Array(half + 1);
  const xr = new Float64Array(N), xi = new Float64Array(N); let nseg = 0;
  for (let st = i0; st + N <= i1; st += hop){
    for (let i = 0; i < N; i++){ xr[i] = (s.data[st + i] - mean)*gain*w[i]; xi[i] = 0; }
    const [R, I] = fft(P, xr, xi);
    for (let k = 0; k <= half; k++) acc[k] += R[k]*R[k] + I[k]*I[k];
    nseg++;
  }
  const df = fs/N; const psd = new Float64Array(half + 1);
  for (let k = 0; k <= half; k++) psd[k] = acc[k]/nseg/(fs*U)*((k === 0 || (k === half && N % 2 === 0)) ? 1 : 2);
  const bands = bandsFor(p.bands, p.fmin, Math.min(p.fmax, fs/2/Math.pow(10, (p.bands === "1/1" ? 3 : 1)/20)));
  const r2 = ref*ref; const lv = [];
  for (const b of bands){ let sum = 0, any = false; const k0 = Math.ceil(b.lo/df), k1 = Math.min(half, Math.ceil(b.hi/df) - 1);
    for (let k = Math.max(0, k0); k <= k1; k++){ const f = k*df; if (f >= b.lo && f < b.hi){ sum += psd[k]; any = true; } }
    lv.push(any && sum > 0 ? 10*Math.log10(sum*df/r2) : null); }
  const kmax = Math.min(half, Math.ceil((bands.length ? bands.at(-1).hi : fs/2)/df) + 1);
  const nb = new Float32Array(kmax + 1);
  for (let k = 0; k <= kmax; k++) nb[k] = psd[k] > 0 ? 10*Math.log10(psd[k]*df/r2) : -100;
  let tot = 0; for (let k = 1; k <= half; k++) tot += psd[k]*df;
  return { key, n: bands.map(b => b.n), fc: bands.map(b => b.fc), lv, nb, df, N, nseg, q: Q.q, ref, overall: tot > 0 ? 10*Math.log10(tot/r2) : null };
}

function envelope(d, nb){
  const n = d.length, B = Math.min(nb, n), mn = new Float32Array(B), mx = new Float32Array(B);
  for (let b = 0; b < B; b++){ const a = Math.floor(b*n/B), e = Math.max(a + 1, Math.floor((b + 1)*n/B)); let lo = Infinity, hi = -Infinity; for (let i = a; i < e; i++){ const v = d[i]; if (v < lo) lo = v; if (v > hi) hi = v; } mn[b] = lo; mx[b] = hi; }
  return { mn, mx };
}

self.onmessage = e => {
  const m = e.data;
  try {
    if (m.op === "parse"){
      const { chans, skipped } = parseUnv(m.buf, m.name);
      const out = chans.map(c => {
        const key = m.name + "#" + c.idx;
        SIG.set(key, { fs: c.fs, data: c.data, units: c.units, code: c.ordCode });
        const env = envelope(c.data, 1600);
        const { data, ...meta } = c;
        return { ...meta, key, dur: c.data.length/c.fs, q: quantity(c.units, c.ordCode).q, env };
      });
      self.postMessage({ op: "parsed", id: m.id, name: m.name, chans: out, skipped });
    } else if (m.op === "process"){
      const tot = m.jobs.length; let done = 0;
      for (const j of m.jobs){
        const r = process(j.key, j.p); done++;
        self.postMessage({ op: "result", id: m.id, mid: j.mid, r, done, tot }, r.nb ? [r.nb.buffer] : []);
      }
      self.postMessage({ op: "done", id: m.id });
    }
  } catch(err){ self.postMessage({ op: "error", id: m.id, message: String(err && err.message || err) }); }
};

<script>
"use strict";
const KEY = "gestor-tercios-2250.v1";

/* ---------- utilities ---------- */

async function readXlsxFile(file){
  if (typeof XLSX === "undefined") throw new Error("The Excel reader (SheetJS) didn't load. Check your connection and reload.");
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type: "array" });
  if (isAeWorkbook(wb)) return [parseAeWorkbook(wb, file.name)];
  let lastErr = null; const all = [];
  for (const sn of wb.SheetNames){
    const aoa = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, raw: true, defval: null });
    try { const P = parseAoa(aoa, file.name); P.sheet = sn; all.push(P); }
    catch(e){ try { const P = parseFftAoa(aoa, file.name); P.sheet = sn; all.push(P); } catch(e2){ lastErr = e; } }
  }
  if (!all.length) throw lastErr || new Error("No recognisable data in the file.");
  return all;
}
async function handleFiles(files, dest){

    let Ps;
    try { Ps = await readXlsxFile(file); } catch(e){ toast(e.message); continue; }
    for (const P of Ps) await (P.ae ? aeDialog(P, dest) : P.fft ? fftDialog(P, dest) : importDialog(P, dest));
  }
}

function exportXlsx(ids){
  if (typeof XLSX === "undefined"){ toast("Excel library not available"); return; }
  const ms = [...new Set(topLevel(ids).flatMap(measUnder))].filter(id => N(id).d.kind !== "ae"); if (!ms.length){ toast("Nothing to export (insulation tests: use Copy table in the test)"); return; }
  const metrics = [...new Set(ms.flatMap(id => Object.keys(N(id).d.m)))];
  const freqs = [...new Set(ms.flatMap(id => N(id).d.f))].sort((a, b) => a - b);

const CRCT = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++){ let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();

const WSRC = document.getElementById("wsrc").textContent;

  try {
    WK = new Worker(URL.createObjectURL(new Blob([WSRC], { type: "text/javascript" })));

    new Function("self", WSRC)(fake);
    WK = { postMessage: (m) => setTimeout(() => fake.onmessage({ data: m }), 0) };

  if (!jobs.length){ toast(missing ? `Time signals not loaded (${missing}). Use “Load source files…” and pick the .unv files.` : "No time-signal measurements here"); return; }
  BUSY = { done: 0, tot: jobs.length }; showBusy();

}
